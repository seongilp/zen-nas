server.modules = ("mod_webdav", "mod_auth", "mod_authn_file", "mod_accesslog")
server.port = 8080
# rc 스크립트가 status/stop 에 pidfile 을 기대 — 명시하지 않으면 오탐
server.pid-file = "/var/run/lighttpd.pid"
server.document-root = "/tank/webdav"
server.errorlog = "/var/log/lighttpd/error.log"
accesslog.filename = "/var/log/lighttpd/access.log"
server.username = "www"
server.groupname = "www"

$HTTP["url"] =~ "^/" {
    webdav.activate = "enable"
    auth.backend = "htpasswd"
    auth.backend.htpasswd.userfile = "/usr/local/etc/lighttpd/htpasswd"
    auth.require = ( "" => ("method" => "basic", "realm" => "zen", "require" => "valid-user") )
}

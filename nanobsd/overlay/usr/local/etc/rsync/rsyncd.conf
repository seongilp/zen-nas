# rc 스크립트가 status/stop 에 /var/run/rsyncd.pid 를 기대 — 명시하지 않으면 오탐
pid file = /var/run/rsyncd.pid
uid = nobody
gid = nobody
use chroot = yes
max connections = 4
log file = /var/log/rsyncd.log


# zen.conf — zen NAS OS NanoBSD 빌드 설정 (amd64, UEFI+BIOS 하이브리드)
#
# 이 파일은 base nanobsd 가 아니라 embedded 프레임워크(embedded/common)를 쓴다.
# std-uefi-bios(GPT: EFI + freebsd-boot + cfg + root A/B) 레이아웃과
# create_diskimage 로직이 오직 embedded/common 에만 정의돼 있기 때문이다.
#
# common 은 pwd 기준으로 NANO_SRC/NANO_OBJ/출력 경로를 계산하고 `. common` 을
# cwd 에서 찾으므로, 반드시 embedded 디렉터리 안에서 그 위치의 nanobsd.sh 로 실행해야 한다.
#
# 실행(VM 안):
#   cp zen.conf /usr/src/tools/tools/nanobsd/embedded/zen.conf
#   cd /usr/src/tools/tools/nanobsd/embedded
#   sh ../nanobsd.sh -c zen.conf
#
# 산출물(raw 디스크 이미지, USB 에 dd / QEMU 부팅 겸용):
#   /usr/embedded/images/_.disk.image.zen        (원본)
#   /usr/embedded/images/_.disk.image.zen.xz     (xz 압축본)

# --- embedded/common 이 std_${NANO_ARCH} 와 레이아웃 case 를 돌리기 전에 필요 ---
NANO_ARCH=amd64                     # aarch64 호스트에서 amd64 크로스 빌드
NANO_NAME=zen
NANO_KERNEL=GENERIC                 # std_i386 이 : ${NANO_KERNEL:=GENERIC} 로 기본화하지만 명시
NANO_LAYOUT=std-uefi-bios           # GPT + EFI(UEFI) + freebsd-boot(BIOS) 하이브리드 (정찰로 확인)

. common                            # embedded 공통 정의 로드 (cwd=embedded 필수)

# BIOS 부팅 부트코드: GPT에서는 boot0(MBR 셀렉터)가 동작하지 않는다 (embedded/common의
# 기본값 bitrot — "1 ?" 메뉴에서 정지). GPT의 표준 체인인 pmbr → gptboot(freebsd-boot
# 파티션) → loader 를 쓰도록 PMBR 부트코드를 pmbr로 교체한다.
# NANO_WORLDDIR 는 common 이 소싱 시점에 ${NANO_LOG}/_.w 로 확정(realpath)해 두므로
# 그대로 참조하면 된다. std_i386 의 `:=` 기본값(boot0sio)은 이 대입으로 덮어써진다.
NANO_BOOT_MBR="${NANO_WORLDDIR}/boot/pmbr"

# 기본 tmpfs(≈5MB)는 samba tdb/로그에 부족 — smbd가 ENOSPC로 죽는다 (Task 11 스모크에서 확인).
# common 이 8192(= 4MB)로 잡아둔 것을 늘린다. 단위는 512바이트 섹터:
# 값이 conf/base/{etc,var}/md_size 로 들어가 rc.initdiskless 의 mdmfs/tmpfs -s 에 그대로
# 전달된다 (rc.initdiskless 주석: "30000" → 15MB MFS).
NANO_RAM_ETCSIZE=65536      # /etc  32MB — save_cfg 대상이라 여유 필요
NANO_RAM_TMPVARSIZE=262144  # /var 128MB — samba tdb·로그·pidfile

#
# common 이 자동 처리하는 것들(중복 설정 금지):
#   NANO_SRC=/usr/src, NANO_OBJ=/usr/embedded/obj, 출력 경로, NANO_PMAKE(-j ncpu),
#   NANO_IMAGES=2(듀얼 슬라이스 A/B), 경량 CONF_BUILD/CONF_INSTALL,
#   그리고 common 이 이미 customize_cmd 로 등록하는 스톡 함수들(일부:
#     cust_allow_ssh_root, cust_install_files(nanobsd/Files 의 A/B 업데이트 스크립트),
#     cust_comconsole(시리얼 콘솔), typical_embedded(growfs 기반 첫 부팅 확장), fix_pkg 등
#     — 전체 목록은 embedded/common 참조)이 있으므로 여기서 재등록하지 않는다(중복 실행 방지).
#
# 이미지 크기: embedded 프레임워크는 NANO_MEDIASIZE 를 쓰지 않는다(그건 legacy.sh 전용).
#   root 슬라이스는 내용물에 딱 맞게 만들어지고, 첫 부팅 때 growfs(nanobsd-pingpong)로
#   미디어 전체를 채우도록 확장된다 → "8GB USB" 요건은 자동 충족.

# --- 빌드 추가 경량화 (common 에 이미 WITHOUT_TESTS/GAMES 있음, LLDB 만 추가) ---
CONF_BUILD="${CONF_BUILD}
WITHOUT_LLDB=YES
"
CONF_INSTALL="${CONF_INSTALL}
WITHOUT_LLDB=YES
"

# --- 커스터마이즈 함수 (common 소싱 이후 정의·등록해야 함) ---

# std-uefi-bios 레이아웃이 기대하는 ESP 이미지(boot/efiboot.img)를 생성한다.
# installworld 는 loader.efi 만 설치하고 ESP 이미지는 아무도 만들지 않는 embedded/common 의
# bitrot(common 은 참조만 함) — release 의 make_esp_file(tools/boot/install-boot.sh)과
# 동일한 makefs 인자(fat_type=32, sectors_per_cluster=1, volume_label=EFISYS,
# 크기 fat32min=33292k)로 직접 생성한다.
# 크로스 빌드이므로 부트 파일명은 amd64용 bootx64.efi 로 고정한다
# (get_uefi_bootname 은 ${TARGET:-$(uname -m)} 기반이라 aarch64 호스트에선 bootaa64 가 나옴).
cust_zen_efiboot () (
    stage=$(mktemp -d)
    mkdir -p "${stage}/EFI/BOOT"
    cp "${NANO_WORLDDIR}/boot/loader.efi" "${stage}/EFI/BOOT/bootx64.efi"
    makefs -t msdos -o fat_type=32 -o sectors_per_cluster=1 \
        -o volume_label=EFISYS -s 33292k \
        "${NANO_WORLDDIR}/boot/efiboot.img" "${stage}"
    rm -rf "${stage}"
)

# amd64 패키지를 호스트(aarch64) pkg 로 이미지 루트에 크로스 설치.
# 스톡 cust_pkgng 은 chroot 안에서 amd64 pkg 를 실행해 aarch64 호스트에선 불가 → 대체.
# find ... -exec ... + 로 모든 .pkg 를 한 번에 넘겨 상호 의존성을 함께 해결한다.
# (pkg 2.6.2 는 fetch 파일을 All/Hashed/ 아래 해시 접미사로 두므로 이름 대신 find 로 수집)
cust_zen_pkgs () (
    [ -n "$(find /zen/packages -name '*.pkg' -print -quit)" ] || { echo "cust_zen_pkgs: /zen/packages 에 패키지가 없다" >&2; exit 1; }
    # NOTE: FreeBSD 메이저 버전 업그레이드 시 ABI도 함께 올릴 것 — IGNORE_OSVERSION=yes 라서 낡은 ABI는 조용히 잘못 설치된다
    # PKG_DBDIR 를 월드 디렉토리 안(/pkg/db — fix_pkg 가 이미지 pkg.conf 에 지정한 위치)에 고정:
    # 호스트 pkg 가 rootdir 의 pkg.conf 를 읽되 경로를 호스트 기준으로 해석해 DB 가 호스트에
    # 남는 문제(재빌드 시 already-installed 로 전부 건너뜀 → 빈 이미지)를 방지하고,
    # 런타임에도 NAS 의 pkg info 가 내장 패키지를 올바로 나열하게 된다.
    find /zen/packages -name '*.pkg' -exec \
        pkg -o ABI="FreeBSD:15:amd64" -o IGNORE_OSVERSION=yes \
            -o PKG_DBDIR="${NANO_WORLDDIR}/pkg/db" \
            --rootdir "${NANO_WORLDDIR}" add -I {} +
)

# zen 오버레이(rc.conf, smb4.conf, zen-cfg-backup 등)를 이미지 루트에 복사.
cust_zen_overlay () (
    cd /zen/overlay
    find . -print | cpio -dumpv "${NANO_WORLDDIR}"
)

# 오버레이가 넣어둔 crontab.zen 항목을 시스템 crontab 에 병합(cfg 자동 백업 등).
cust_zen_crontab () (
    cat "${NANO_WORLDDIR}/etc/crontab.zen" >> "${NANO_WORLDDIR}/etc/crontab"
    rm "${NANO_WORLDDIR}/etc/crontab.zen"
)

customize_cmd cust_zen_efiboot
customize_cmd cust_zen_pkgs
customize_cmd cust_zen_overlay
customize_cmd cust_zen_crontab
